name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the BSD date and stat branches, and the workflow index test below.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A CLI that started asking for input would hang its test: tests/contract_modes.bats runs them
    # with a terminal on stdin and nothing to read.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install CLI deps
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install bats-core jq
            # macOS ships sqlite3, but do not assume its build has FTS5.
            if ! sqlite3 :memory: 'CREATE VIRTUAL TABLE t USING fts5(x);'; then
              brew install sqlite
              echo "$(brew --prefix sqlite)/bin" >>"$GITHUB_PATH"
            fi
            # The floor the engine needs, and FTS5 in the sqlite module of this python3.
            python3 -c 'import sqlite3, sys; assert sys.version_info >= (3, 10), sys.version; sqlite3.connect(":memory:").execute("CREATE VIRTUAL TABLE t USING fts5(x)")'
          else
            sudo apt-get update && sudo apt-get install -y sqlite3 jq bats
          fi

      - name: Bootstrap a synthetic index (no private data)
        run: |
          mkdir -p "$HOME/.claude/bin" "$HOME/.claude/hooks"
          cp bin/session-search.py bin/claude-search "$HOME/.claude/bin/"
          cp -R hooks/. "$HOME/.claude/hooks/"
          python3 assets/demo/build_demo_db.py "$HOME/.claude/session-index.db"

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Bats tests
        run: bats tests/

      - name: Smoke test
        run: bash tests/smoke-test.sh

      # hooks/session-index-sweep.sh uses BSD `stat -f` with no GNU fallback, and hooks are out of
      # the CLI plan's scope. This test can pass only on macOS; the macOS matrix entry runs it.
      - name: Workflow index test
        if: runner.os == 'macOS'
        run: bash tests/workflow-index-test.sh
